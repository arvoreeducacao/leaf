name: PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: leaf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pleaf"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      LEAF_TEST_DATABASE_URL: mysql://root:leaf@127.0.0.1:3306/leaf_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the test databases
        run: mysql -h 127.0.0.1 -P 3306 -u root -pleaf < scripts/test-databases.sql

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: leaf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pleaf"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      LEAF_E2E_DATABASE_URL: mysql://root:leaf@127.0.0.1:3306/leaf_e2e
      LEAF_E2E_REALTIME_DATABASE_URL: mysql://root:leaf@127.0.0.1:3306/leaf_e2e_realtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the test databases
        run: mysql -h 127.0.0.1 -P 3306 -u root -pleaf < scripts/test-databases.sql

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm exec next build
        env:
          LEAF_DIST_DIR: .next-e2e
          DATABASE_URL: mysql://root:leaf@127.0.0.1:3306/leaf

      - name: E2E
        run: pnpm exec playwright test --max-failures=1

      - name: Keep the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
